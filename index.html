<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrot Spinner</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Modal Animation */
    .modal-animate {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col overflow-x-hidden">

  <!-- Header / Navigation Bar -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 px-6 py-3 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <div class="bg-orange-500 text-white p-2 rounded-xl shadow-lg shadow-orange-500/20">
        <i class="fa-solid fa-carrot text-2xl"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent">
          Carrot Spinner
        </h1>
        <p class="text-xs text-slate-400 font-medium">jonatzdelacruz | v3.1</p>
      </div>
    </div>

    <!-- Active Room PIN Badge & Presenter Controls -->
    <div class="flex items-center space-x-4">
      <div class="bg-slate-900/90 border border-slate-700 px-4 py-1.5 rounded-xl flex items-center space-x-3">
        <span class="text-xs uppercase tracking-wider text-slate-400 font-bold">Room PIN:</span>
        <span id="roomPinDisplay" class="text-xl font-extrabold text-amber-400 font-mono">------</span>
      </div>
      
      <button onclick="openQRModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-xl transition flex items-center space-x-2 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-qrcode"></i>
        <span>Show QR</span>
      </button>

      <button onclick="spin()" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-white font-bold px-6 py-2 rounded-xl shadow-lg shadow-orange-500/30 transition transform active:scale-95 flex items-center space-x-2">
        <i class="fa-solid fa-play"></i>
        <span>SPIN!</span>
      </button>
    </div>
  </header>

  <!-- Main Grid Workspace -->
  <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-12 gap-4 max-w-[1920px] w-full mx-auto">

    <!-- COLUMN 1: Large Spinner Wheel Stage (~72% width on desktop) -->
    <section class="lg:col-span-8 xl:col-span-9 bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 flex flex-col items-center justify-center relative min-h-[500px]">
      
      <!-- Top Pointer Arrow -->
      <div class="absolute top-2 z-10 text-red-500 drop-shadow-[0_4px_6px_rgba(0,0,0,0.5)] transform translate-y-1">
        <i class="fa-solid fa-caret-down text-5xl"></i>
      </div>

      <!-- Container that auto-scales canvas based on available height -->
      <div id="canvasContainer" class="w-full flex-1 flex items-center justify-center relative max-h-[calc(100vh-120px)]">
        <canvas id="wheelCanvas" class="max-w-full max-h-full object-contain cursor-pointer"></canvas>
      </div>

      <!-- Quick Action Toolbar -->
      <div class="mt-4 flex flex-wrap items-center justify-center gap-3">
        <button onclick="shuffleRoster()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg transition">
          <i class="fa-solid fa-shuffle mr-1"></i> Shuffle
        </button>
        <button onclick="sortRoster()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg transition">
          <i class="fa-solid fa-arrow-down-a-z mr-1"></i> Sort A-Z
        </button>
        <label class="flex items-center space-x-2 bg-slate-900/60 border border-slate-700/60 px-3 py-1.5 rounded-lg cursor-pointer text-xs">
          <input type="checkbox" id="eliminateWinner" class="rounded bg-slate-800 border-slate-600 text-orange-500 focus:ring-0">
          <span class="text-slate-300">Eliminate Winner</span>
        </label>
      </div>
    </section>

    <!-- COLUMN 2: Audience Mobile Portal & Draw History Sidebar (~28% width on desktop) -->
    <section class="lg:col-span-4 xl:col-span-3 flex flex-col space-y-4">
      
      <!-- Audience Mobile Portal Block -->
      <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wide flex items-center space-x-2">
            <i class="fa-solid fa-mobile-screen-button text-indigo-400"></i>
            <span>Audience Mobile Portal</span>
          </h2>
          <span id="rosterCountBadge" class="bg-indigo-500/20 text-indigo-300 text-xs px-2 py-0.5 rounded-full font-mono">0 Names</span>
        </div>
        
        <!-- Roster Quick Input Area -->
        <textarea id="rosterInput" rows="4" placeholder="Enter names (one per line)..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 resize-none mb-2" oninput="updateRosterFromText()"></textarea>
        <div class="text-[10px] text-slate-500 flex justify-between">
          <span>Auto-sync active</span>
          <span>Press Enter for new line</span>
        </div>
      </div>

      <!-- Draw History Log Block -->
      <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 flex-1 flex flex-col min-h-[250px]">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wide flex items-center space-x-2">
            <i class="fa-solid fa-trophy text-amber-400"></i>
            <span>Draw History</span>
          </h2>
          <button onclick="clearHistory()" class="text-slate-500 hover:text-red-400 text-xs transition">Clear</button>
        </div>

        <div id="drawHistoryLog" class="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl p-3 overflow-y-auto max-h-[300px] space-y-2">
          <p class="text-xs text-slate-500 italic text-center py-4">No winners drawn yet.</p>
        </div>
      </div>

    </section>
  </main>

  <!-- Winner Modal Popup -->
  <div id="winnerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl max-w-md w-full text-center shadow-2xl modal-animate relative">
      <div class="w-16 h-16 bg-amber-500/20 border border-amber-500/40 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-400 text-3xl">
        <i class="fa-solid fa-crown"></i>
      </div>
      <h3 class="text-sm uppercase tracking-widest text-slate-400 font-bold mb-1">We Have A Winner!</h3>
      <div id="winnerName" class="text-3xl font-extrabold text-amber-300 py-3 mb-6 border-y border-slate-700/60 font-mono break-words">---</div>
      <button onclick="closeWinnerModal()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-white font-bold py-3 rounded-xl shadow-lg transition">
        Continue
      </button>
    </div>
  </div>

  <!-- QR Code Display Modal -->
  <div id="qrModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl modal-animate relative">
      <button onclick="closeQRModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <h3 class="text-lg font-bold text-slate-200 mb-1">Scan to Join Room</h3>
      <p id="qrRoomPinLabel" class="text-xs text-amber-400 font-mono mb-4">PIN: ------</p>
      
      <div class="bg-white p-4 rounded-2xl inline-block shadow-inner mb-4">
        <div id="qrcode"></div>
      </div>
      
      <p class="text-xs text-slate-400">Point phone camera to submit entries to this Carrot Spinner session.</p>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    // State Variables
    let currentRoomPin = "1001";
    let roster = ["Alex", "Jordan", "Taylor", "Morgan", "Sam", "Chris", "Pat", "Riley"];
    let history = [];
    let isSpinning = false;

    // Wheel Physics & Math State
    let startAngle = 0;
    let spinTimeout = null;
    let spinAngleStart = 10;
    let spinTime = 0;
    let spinTimeTotal = 0;

    // Palette Colors
    const colors = [
      "#F97316", "#F59E0B", "#10B981", "#06B6D4", "#3B82F6",
      "#6366F1", "#8B5CF6", "#EC4899", "#E11D48", "#84CC16"
    ];

    // DOM Elements
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const rosterInput = document.getElementById('rosterInput');

    window.addEventListener('DOMContentLoaded', () => {
      initRoom();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
    });

    function initRoom() {
      // Generate or retrieve 6-digit Room PIN
      currentRoomPin = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('roomPinDisplay').innerText = currentRoomPin;
      document.getElementById('qrRoomPinLabel').innerText = `PIN: ${currentRoomPin}`;
      rosterInput.value = roster.join('\n');
      updateRosterBadge();
      drawWheel();
    }

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      const size = Math.min(container.clientWidth, container.clientHeight) - 20;
      canvas.width = Math.max(size, 300);
      canvas.height = Math.max(size, 300);
      drawWheel();
    }

    function updateRosterFromText() {
      const raw = rosterInput.value.split('\n');
      roster = raw.map(s => s.trim()).filter(s => s.length > 0);
      updateRosterBadge();
      drawWheel();
    }

    function updateRosterBadge() {
      document.getElementById('rosterCountBadge').innerText = `${roster.length} Names`;
    }

    function drawWheel() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (roster.length === 0) {
        // Empty State Rendering
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.arc(0, 0, canvas.width / 2 - 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#94A3B8';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Add names to populate wheel', 0, 0);
        ctx.restore();
        return;
      }

      const outsideRadius = canvas.width / 2 - 15;
      const insideRadius = 40;
      const arc = (Math.PI * 2) / roster.length;

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);

      for (let i = 0; i < roster.length; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = colors[i % colors.length];

        // Draw Wedge Slice
        ctx.beginPath();
        ctx.arc(0, 0, outsideRadius, angle, angle + arc, false);
        ctx.arc(0, 0, insideRadius, angle + arc, angle, true);
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Slice Text Rendering
        ctx.save();
        ctx.fillStyle = "#ffffff";

        // Dynamic Font Scaling
        let fontSize = Math.floor(outsideRadius / (roster.length * 0.4));
        fontSize = Math.min(Math.max(fontSize, 11), 22);
        ctx.font = `bold ${fontSize}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Horizontal Slice Text Placement
        const textAngle = angle + arc / 2;
        const textRadius = (outsideRadius + insideRadius) / 2;
        const textX = Math.cos(textAngle) * textRadius;
        const textY = Math.sin(textAngle) * textRadius;

        ctx.translate(textX, textY);
        
        // Truncate long strings for narrow slices
        let text = roster[i];
        if (text.length > 12) text = text.substring(0, 10) + '..';
        ctx.fillText(text, 0, 0);

        ctx.restore();
      }

      // Draw Center Hub Cap
      ctx.beginPath();
      ctx.arc(0, 0, insideRadius, 0, Math.PI * 2, false);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.restore();
    }

    function rotateWheel() {
      spinTime += 30;
      if (spinTime >= spinTimeTotal) {
        clearTimeout(spinTimeout);
        isSpinning = false;
        determineWinner();
        return;
      }
      
      // Dynamic Easing Physics
      const spinProgress = spinTime / spinTimeTotal;
      const easeOut = 1 - Math.pow(1 - spinProgress, 3);
      const angleChange = spinAngleStart * (1 - easeOut);
      
      startAngle += (angleChange * Math.PI / 180);
      drawWheel();
      spinTimeout = setTimeout(rotateWheel, 30);
    }

    function spin() {
      if (isSpinning || roster.length === 0) return;
      isSpinning = true;
      spinAngleStart = Math.random() * 10 + 15;
      spinTime = 0;
      spinTimeTotal = Math.random() * 3000 + 10000; // 10 to 13 seconds
      rotateWheel();
    }

    function determineWinner() {
      const degrees = (startAngle * 180 / Math.PI) % 360;
      const arcd = 360 / roster.length;
      
      // Pointer is fixed at top center (270 degrees)
      let index = Math.floor((360 - (degrees % 360) + 270) % 360 / arcd);
      index = (index + roster.length) % roster.length;

      const winner = roster[index];
      document.getElementById('winnerName').innerText = winner;
      document.getElementById('winnerModal').classList.remove('hidden');

      // Add to Draw Logs
      history.unshift({ name: winner, time: new Date().toLocaleTimeString() });
      renderHistory();

      // Handle Winner Elimination Option
      if (document.getElementById('eliminateWinner').checked) {
        roster.splice(index, 1);
        rosterInput.value = roster.join('\n');
        updateRosterBadge();
        drawWheel();
      }
    }

    function closeWinnerModal() {
      document.getElementById('winnerModal').classList.add('hidden');
    }

    function renderHistory() {
      const container = document.getElementById('drawHistoryLog');
      if (history.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 italic text-center py-4">No winners drawn yet.</p>`;
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="flex items-center justify-between bg-slate-800/80 p-2 rounded-lg border border-slate-700/50">
          <span class="text-xs font-semibold text-amber-300 font-mono">${item.name}</span>
          <span class="text-[10px] text-slate-500">${item.time}</span>
        </div>
      `).join('');
    }

    function clearHistory() {
      history = [];
      renderHistory();
    }

    function shuffleRoster() {
      for (let i = roster.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [roster[i], roster[j]] = [roster[j], roster[i]];
      }
      rosterInput.value = roster.join('\n');
      drawWheel();
    }

    function sortRoster() {
      roster.sort((a, b) => a.localeCompare(b));
      rosterInput.value = roster.join('\n');
      drawWheel();
    }

    function openQRModal() {
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      
      // Formulate Target URL pointing strictly to submit.html
      let baseUrl = window.location.href.split('?')[0].split('#')[0];
      if (baseUrl.endsWith('/index.html')) {
        baseUrl = baseUrl.replace('/index.html', '/submit.html');
      } else if (baseUrl.endsWith('/')) {
        baseUrl += 'submit.html';
      } else {
        baseUrl = baseUrl.substring(0, baseUrl.lastIndexOf('/')) + '/submit.html';
      }

      const targetUrl = `${baseUrl}?pin=${currentRoomPin}`;

      new QRCode(qrContainer, {
        text: targetUrl,
        width: 180,
        height: 180,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }
  </script>
</body>
</html>
