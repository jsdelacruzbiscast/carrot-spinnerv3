<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner - Join Stage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #2b0000 0%, #800000 50%, #1a0000 100%);
      color: #ffffff;
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.25);
    }
  </style>
</head>
<body class="flex items-center justify-center p-4">

  <div class="glass-card w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-black tracking-wide text-amber-400">CARROT SPINNER</h1>
      <p class="text-xs text-amber-200/70">BISCAST Student Development Services</p>
    </div>

    <form id="entryForm" onsubmit="submitParticipant(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-amber-200 uppercase mb-1">Room PIN</label>
        <input type="text" id="inputPin" required placeholder="123456" 
          class="w-full bg-black/40 border border-amber-500/40 rounded-lg px-4 py-3 text-center text-xl font-mono tracking-widest text-amber-300 focus:outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="block text-xs font-semibold text-amber-200 uppercase mb-1">Your Full Name</label>
        <input type="text" id="inputName" required placeholder="e.g. Juan Dela Cruz" 
          class="w-full bg-black/40 border border-amber-500/40 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <button type="submit" id="btnSubmit" 
        class="w-full bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-600 hover:to-yellow-700 text-black font-extrabold py-3.5 rounded-lg shadow-lg transition active:scale-[0.98]">
        Join Spinner Roster
      </button>
    </form>

    <div id="statusMessage" class="hidden text-center text-sm p-3 rounded-lg font-medium"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyKGHEUW7PzF3mlkQuPDs7j8imrgNi-aTQKLyApPLDCfarpjo_01mNc6kR8area5sM8/exec';

    // Parse PIN from query parameter automatically
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pin = urlParams.get('pin');
      if (pin) {
        document.getElementById('inputPin').value = pin;
      }
    });

    async function submitParticipant(e) {
      e.preventDefault();
      const pin = document.getElementById('inputPin').value.trim();
      const name = document.getElementById('inputName').value.trim();
      const status = document.getElementById('statusMessage');
      const btn = document.getElementById('btnSubmit');

      if (!pin || !name) return;

      btn.disabled = true;
      btn.innerText = "Submitting...";

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitName',
            pin: pin,
            name: name,
            section: 'Pangalan'
          })
        });

        const data = await res.json();
        if (data.status === 'success') {
          status.className = "text-center text-sm p-3 rounded-lg font-medium bg-emerald-900/60 text-emerald-300 border border-emerald-500/40";
          status.innerText = "🎉 You're in! Watch the presentation screen.";
          document.getElementById('inputName').value = '';
        } else {
          throw new Error(data.message || 'Submission failed');
        }
      } catch (err) {
        status.className = "text-center text-sm p-3 rounded-lg font-medium bg-rose-900/60 text-rose-300 border border-rose-500/40";
        status.innerText = "Error: " + err.message;
      } finally {
        status.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "Join Spinner Roster";
      }
    }
  </script>
</body>
</html>
