<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner v3.1 - Presenter Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { background: #0B0F17; color: #F8FAFC; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Top Navigation Header -->
  <header class="glass-card px-6 py-4 flex items-center justify-between border-b border-slate-800">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-orange-500 to-amber-400 rounded-xl flex items-center justify-center text-xl font-black shadow-lg">
        🥕
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-wide text-white">CARROT Spinner</h1>
        <p class="text-xs text-slate-400">jonatzdelacruz | v3.1 Stage Edition</p>
      </div>
    </div>

    <!-- Active Room Badge -->
    <div class="flex items-center gap-4">
      <div class="flex flex-col items-end">
        <span class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Active Room PIN</span>
        <span id="activePinDisplay" class="font-mono text-2xl font-black text-orange-400">------</span>
      </div>
      <button id="roomControlBtn" onclick="toggleRoomSession()" class="px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg transition">
        🎲 Start Room
      </button>
    </div>
  </header>

  <!-- Main Stage Workspace -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-6 max-w-7xl mx-auto w-full">
    
    <!-- Wheel Display (Canvas) -->
    <div class="lg:col-span-2 glass-card rounded-2xl p-6 flex flex-col items-center justify-center relative min-h-[500px]">
      
      <!-- Top Center Pointer Marker -->
      <div class="absolute top-4 z-20 w-0 h-0 border-l-[18px] border-l-transparent border-r-[18px] border-r-transparent border-t-[32px] border-t-orange-500 drop-shadow-lg"></div>

      <!-- Wheel Canvas -->
      <canvas id="wheelCanvas" width="500" height="500" class="max-w-full h-auto drop-shadow-2xl"></canvas>

      <!-- Spin Controls -->
      <div class="mt-6 flex items-center gap-4">
        <button id="spinBtn" onclick="triggerSpin()" class="px-8 py-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-lg font-black rounded-2xl shadow-xl transition transform active:scale-95">
          🎯 SPIN WHEEL
        </button>
        <button onclick="resetRoster()" class="px-4 py-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl border border-slate-700">
          🔄 Reset
        </button>
      </div>
    </div>

    <!-- Roster & Session Controls -->
    <div class="glass-card rounded-2xl p-6 flex flex-col justify-between space-y-4">
      <div>
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <span>👥 Roster</span>
            <span id="rosterCountBadge" class="text-xs bg-slate-800 text-orange-400 border border-slate-700 px-2.5 py-0.5 rounded-full font-mono">0</span>
          </h2>
          <span id="pollingStatusBadge" class="text-xs text-slate-500 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-slate-500"></span> Idle
          </span>
        </div>

        <textarea id="manualRosterInput" oninput="updateRosterFromTextarea()" rows="12" placeholder="Enter one name per line..." 
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-orange-500 font-mono"></textarea>
      </div>

      <div class="text-xs text-slate-400 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
        💡 <strong>Tip:</strong> Press <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-200 font-mono">Spacebar</kbd> on your keyboard to trigger spins!
      </div>
    </div>
  </main>

  <!-- Winner Modal -->
  <div id="winnerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl relative">
      <div class="text-5xl mb-2">🎉</div>
      <h3 class="text-xs font-bold text-orange-400 tracking-widest uppercase">Winner Selected</h3>
      <h2 id="winnerNameDisplay" class="text-3xl font-black text-white my-4">---</h2>
      <button onclick="closeWinnerModal()" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg">
        Continue (Spacebar)
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzmn_bEzidauL9CNgsI8Sp7ezjev8ZjTBYI9RckwkzvZ21JIxVx7_LuJBmkSWvR7FHssA/exec";

    let roster = ["Participant 1", "Participant 2", "Participant 3", "Participant 4", "Participant 5", "Participant 6"];
    let activePin = null;
    let pollInterval = null;
    let isSpinning = false;
    let currentAngle = 0;
    let audioCtx = null;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const textarea = document.getElementById('manualRosterInput');

    // Pre-warm Web Audio API Context on first gesture
    window.addEventListener('pointerdown', initAudio, { once: true });
    window.addEventListener('keydown', initAudio, { once: true });

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTickSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    // Adaptive Polling & Page Visibility Listener
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopPolling();
      } else if (activePin) {
        startAdaptivePolling();
      }
    });

    function startAdaptivePolling() {
      stopPolling();
      updatePollingBadge('Active', 'bg-emerald-500');
      pollLiveRoster();
      pollInterval = setInterval(pollLiveRoster, 4000); // 4-second cycle when active tab
    }

    function stopPolling() {
      if (pollInterval) clearInterval(pollInterval);
      updatePollingBadge('Paused', 'bg-slate-500');
    }

    function updatePollingBadge(text, dotColor) {
      document.getElementById('pollingStatusBadge').innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor}"></span> ${text}`;
    }

    async function pollLiveRoster() {
      if (!activePin || isSpinning) return;
      try {
        const res = await fetch(`${API_URL}?action=getRoster&pin=${activePin}`);
        const data = await res.json();
        if (data.status === 'SUCCESS' && Array.isArray(data.roster)) {
          // Merge unique incoming entries
          const merged = Array.from(new Set([...roster, ...data.roster]));
          if (merged.length !== roster.length) {
            roster = merged;
            syncUI();
          }
        }
      } catch (err) {
        console.warn("Polling request deferred.");
      }
    }

    async function toggleRoomSession() {
      const btn = document.getElementById('roomControlBtn');
      if (!activePin) {
        btn.textContent = 'Creating...';
        btn.disabled = true;

        try {
          const res = await fetch(`${API_URL}?action=createRoom`);
          const data = await res.json();
          if (data.status === 'SUCCESS') {
            activePin = data.pin;
            document.getElementById('activePinDisplay').textContent = activePin;
            btn.textContent = '🔒 Lock Room';
            btn.className = 'px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg transition';
            startAdaptivePolling();
          }
        } catch (e) {
          alert("Failed to initialize room.");
        } finally {
          btn.disabled = false;
        }
      } else {
        // Lock / Close session
        activePin = null;
        stopPolling();
        document.getElementById('activePinDisplay').textContent = '------';
        btn.textContent = '🎲 Start Room';
        btn.className = 'px-5 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl shadow-lg transition';
      }
    }

    function syncUI() {
      textarea.value = roster.join('\n');
      document.getElementById('rosterCountBadge').textContent = roster.length;
      drawWheel();
    }

    function updateRosterFromTextarea() {
      const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      roster = lines.length > 0 ? lines : ["Participant 1"];
      document.getElementById('rosterCountBadge').textContent = roster.length;
      drawWheel();
    }

    // Dynamic Wheel Drawing Engine
    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const N = roster.length;
      if (N === 0) return;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = 220;
      const sliceAngle = (2 * Math.PI) / N;

      const margin5mmInPx = 18.9; // 5mm radial edge margin allowance
      const colors = ['#F97316', '#3B82F6', '#10B981', '#8B5CF6', '#EC4899', '#F59E0B', '#06B6D4'];

      for (let i = 0; i < N; i++) {
        const start = currentAngle + i * sliceAngle;
        const end = start + sliceAngle;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, start, end);
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0F172A';
        ctx.stroke();

        // Dense Roster Text Suppression Logic (N > 60)
        if (N <= 60) {
          ctx.translate(centerX, centerY);
          ctx.rotate(start + sliceAngle / 2);
          ctx.textAlign = 'right';
          ctx.fillStyle = '#FFFFFF';

          // Font scaling logic
          let fontSize = Math.max(12, Math.min(24, Math.floor(300 / N)));
          ctx.font = `bold ${fontSize}px sans-serif`;

          // Position text 5mm (18.9px) from outer rim margin
          const textX = radius - margin5mmInPx;
          ctx.fillText(roster[i], textX, fontSize / 3);
        }
        ctx.restore();
      }

      // Outer rim ring
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#F97316';
      ctx.stroke();
    }

    function triggerSpin() {
      if (isSpinning || roster.length === 0) return;
      isSpinning = true;

      let spinTime = 0;
      const spinTimeTotal = Math.floor(Math.random() * 5000) + 15000; // 15 to 20 seconds extended spin
      let startVelocity = Math.random() * 0.4 + 0.5;

      let lastSegmentIndex = -1;

      function rotate() {
        spinTime += 20;
        if (spinTime >= spinTimeTotal) {
          isSpinning = false;
          announceWinner();
          return;
        }

        // Natural decelerating ease-out curve
        const progress = spinTime / spinTimeTotal;
        const currentVelocity = startVelocity * Math.pow(1 - progress, 3);
        currentAngle += currentVelocity;

        // Sound tick trigger per slice boundary crossover
        const N = roster.length;
        const sliceAngle = (2 * Math.PI) / N;
        const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI))) % (2 * Math.PI);
        const currentSegmentIndex = Math.floor(normalizedAngle / sliceAngle);

        if (currentSegmentIndex !== lastSegmentIndex) {
          playTickSound();
          lastSegmentIndex = currentSegmentIndex;
        }

        drawWheel();
        requestAnimationFrame(rotate);
      }

      rotate();
    }

    function announceWinner() {
      const N = roster.length;
      const sliceAngle = (2 * Math.PI) / N;
      // Top pointer index calculations
      const adjustedAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
      const normalizedAngle = (adjustedAngle + 2 * Math.PI) % (2 * Math.PI);
      const winnerIndex = Math.floor(normalizedAngle / sliceAngle);

      const winnerName = roster[winnerIndex];
      document.getElementById('winnerNameDisplay').textContent = winnerName;
      document.getElementById('winnerModal').classList.remove('hidden');
      document.getElementById('winnerModal').classList.add('flex');

      confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }

    function closeWinnerModal() {
      document.getElementById('winnerModal').classList.add('hidden');
      document.getElementById('winnerModal').classList.remove('flex');
    }

    function resetRoster() {
      roster = ["Participant 1", "Participant 2", "Participant 3", "Participant 4"];
      syncUI();
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement !== textarea) {
        e.preventDefault();
        if (!document.getElementById('winnerModal').classList.contains('hidden')) {
          closeWinnerModal();
        } else {
          triggerSpin();
        }
      }
    });

    // Initial load sync
    syncUI();
  </script>
</body>
</html>
