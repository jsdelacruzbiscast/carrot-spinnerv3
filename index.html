<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner - Host Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    :root {
      --maroon: #800000;
      --gold: #FFD700;
      --dark-bg: #0A0E1A;
      --panel-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 215, 0, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: rgba(128, 0, 0, 0.3);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: bold; color: var(--gold); font-size: 1.2rem; }
    .nav-tabs button {
      background: transparent;
      border: 1px solid transparent;
      color: #ccc;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .nav-tabs button.active {
      background: var(--maroon);
      color: var(--gold);
      border-color: var(--border);
    }
    main {
      flex: 1;
      display: flex;
      position: relative;
      height: calc(100vh - 60px);
    }
    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
      padding: 1rem;
    }
    .tab-content.active { display: flex; }
    
    /* Wheel View */
    .stage-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas#wheelCanvas {
      max-height: calc(100vh - 100px);
      max-width: 100%;
    }
    .pointer {
      position: absolute;
      top: 20px;
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 35px solid var(--gold);
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
    }

    /* Roster Panel */
    .side-panel {
      width: 320px;
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    textarea {
      flex: 1;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      resize: none;
      font-family: inherit;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--maroon);
      color: var(--gold);
      font-weight: bold;
      cursor: pointer;
    }
    .btn-gold { background: var(--gold); color: #000; }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #111827;
      border: 2px solid var(--gold);
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 450px;
      width: 90%;
    }
    #winnerTitle { color: var(--gold); font-size: 2.5rem; margin: 1rem 0; }
  </style>
</head>
<body>

  <header>
    <div class="brand">BISCAST SDS - CARROT Spinner</div>
    <div class="nav-tabs">
      <button class="active" onclick="switchTab('stageTab', this)">🎯 Wheel Stage</button>
      <button onclick="switchTab('rosterTab', this)">📋 Roster & Sync</button>
    </div>
    <div>
      <span>Room PIN: <strong id="pinDisplay" style="color:var(--gold);">------</strong></span>
      <button class="btn btn-gold" style="margin-left:10px;" onclick="openQRModal()">📱 QR Code</button>
    </div>
  </header>

  <main>
    <!-- Stage Tab -->
    <div id="stageTab" class="tab-content active" style="justify-content:center; align-items:center;">
      <div class="stage-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="800" height="800"></canvas>
      </div>
      <div class="side-panel">
        <button class="btn btn-gold" style="font-size:1.2rem; padding:15px;" onclick="spinWheel()">SPIN (Space)</button>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label><input type="checkbox" id="nonRepeatToggle"> Non-Repeat Winner</label>
        </div>
        <div style="margin-top:auto;">
          <small id="syncStatus" style="color:#aaa;">Auto-sync: Active</small>
        </div>
      </div>
    </div>

    <!-- Roster Tab -->
    <div id="rosterTab" class="tab-content" style="gap:1rem;">
      <div style="flex:1; display:flex; flex-direction:column;">
        <h3>Live Roster Data</h3>
        <p style="font-size:0.85rem; color:#aaa; margin-bottom:0.5rem;">Auto-updates from phone registrations. Type below to edit manually.</p>
        <textarea id="rosterInput" placeholder="Enter names (1 per line)..."></textarea>
      </div>
      <div style="width:250px; display:flex; flex-direction:column; gap:10px;">
        <button class="btn" onclick="applyManualRoster()">Apply Roster Changes</button>
        <button class="btn" style="background:#444;" onclick="fetchLiveRoster()">Force Live Sync</button>
      </div>
    </div>
  </main>

  <!-- Modal Announcement -->
  <div id="winnerModal" class="modal">
    <div class="modal-content">
      <h2>🎉 WINNER! 🎉</h2>
      <div id="winnerTitle">Participant Name</div>
      <div style="margin-top:1.5rem; display:flex; gap:10px; justify-content:center;">
        <button class="btn" onclick="closeModal()">Continue</button>
        <button class="btn btn-gold" id="removeBtn" onclick="removeWinnerAndClose()">Remove & Continue</button>
      </div>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qrModal" class="modal">
    <div class="modal-content">
      <h3>Scan to Join Room</h3>
      <div id="qrcode" style="display:flex; justify-content:center; margin:1.5rem 0;"></div>
      <p id="qrUrlText" style="font-size:0.8rem; opacity:0.8;"></p>
      <button class="btn" style="margin-top:1rem;" onclick="closeQRModal()">Close</button>
    </div>
  </div>

  <script>
    // Configuration Settings
    const CONFIG = {
      ENDPOINT: "https://script.google.com/macros/s/AKfycby_6xYp8WFW1E_pyPNjs5IINOAn-BkqDzzib9GBg_bC1WCxCIbyiqAmYohXkhIPPYly6g/exec",
      COLORS: ['#800000', '#A00000', '#D4AF37', '#222222', '#333333']
    };

    let currentRoomPin = Math.floor(100000 + Math.random() * 900000).toString();
    let roster = ["Participant 1", "Participant 2", "Participant 3", "Participant 4"];
    let isSpinning = false;
    let isEditingRoster = false;
    let currentAngle = 0;
    let selectedWinner = "";

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const rosterInput = document.getElementById('rosterInput');

    document.getElementById('pinDisplay').textContent = currentRoomPin;

    // Hotkey Masking to prevent triggers when typing in inputs
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); spinWheel(); }
      if (e.code === 'Escape') { closeModal(); closeQRModal(); }
    });

    rosterInput.addEventListener('focus', () => { isEditingRoster = true; });
    rosterInput.addEventListener('blur', () => { isEditingRoster = false; });

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Canvas Wheel Rendering
    function drawWheel() {
      const numSlices = roster.length;
      if (numSlices === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      const arc = (2 * Math.PI) / numSlices;
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSlices; i++) {
        const angle = currentAngle + i * arc;
        ctx.beginPath();
        ctx.fillStyle = CONFIG.COLORS[i % CONFIG.COLORS.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 10, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();
        ctx.stroke();

        // Label Rendering with 5mm edge offset margin
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#FFF";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(roster[i], radius - 30, 6);
        ctx.restore();
      }
    }

    // Synchronized Wheel Physics Spin
    function spinWheel() {
      if (isSpinning || roster.length === 0) return;
      isSpinning = true;

      const totalRotation = Math.PI * 2 * (5 + Math.random() * 5);
      const duration = 4000;
      const start = performance.now();
      const startAngle = currentAngle;

      function animate(time) {
        let elapsed = time - start;
        let progress = Math.min(elapsed / duration, 1);
        let easeOut = 1 - Math.pow(1 - progress, 3);

        currentAngle = startAngle + totalRotation * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          determineWinner();
        }
      }
      requestAnimationFrame(animate);
    }

    function determineWinner() {
      const numSlices = roster.length;
      const arc = (2 * Math.PI) / numSlices;
      const normalizedAngle = (1.5 * Math.PI - (currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const winnerIndex = Math.floor(normalizedAngle / arc) % numSlices;

      selectedWinner = roster[winnerIndex];
      document.getElementById('winnerTitle').textContent = selectedWinner;
      document.getElementById('winnerModal').style.display = 'flex';
      
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      logWinnerToBackend(selectedWinner);
    }

    function closeModal() { document.getElementById('winnerModal').style.display = 'none'; }

    function removeWinnerAndClose() {
      roster = roster.filter(name => name !== selectedWinner);
      rosterInput.value = roster.join('\n');
      drawWheel();
      closeModal();
    }

    function applyManualRoster() {
      const names = rosterInput.value.split('\n').map(n => n.trim()).filter(n => n);
      if (names.length > 0) {
        roster = names;
        drawWheel();
      }
    }

    // Auto-Sync Live Poll Fetcher
    function fetchLiveRoster() {
      if (isSpinning || isEditingRoster || !CONFIG.ENDPOINT) return;

      const url = `${CONFIG.ENDPOINT}?action=getRoomRoster&pin=${currentRoomPin}&sheet=${currentRoomPin}`;
      fetch(url)
        .then(res => res.json())
        .then(data => {
          let liveNames = [];
          if (data.status === "SUCCESS" && Array.isArray(data.roster)) {
            liveNames = data.roster;
          }
          if (liveNames.length > 0) {
            roster = liveNames;
            rosterInput.value = roster.join('\n');
            drawWheel();
          }
        })
        .catch(err => console.warn("Polling error:", err));
    }

    function logWinnerToBackend(winner) {
      if (!CONFIG.ENDPOINT) return;
      fetch(CONFIG.ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'logWinner', winner: winner, pin: currentRoomPin })
      });
    }

    function openQRModal() {
      const baseUrl = window.location.href.replace('index.html', '').split('?')[0];
      const targetUrl = `${baseUrl}submit.html?pin=${currentRoomPin}`;
      
      document.getElementById('qrcode').innerHTML = '';
      QRCode.toCanvas(targetUrl, { width: 200 }, function (err, canvas) {
        if (!err) document.getElementById('qrcode').appendChild(canvas);
      });
      
      document.getElementById('qrUrlText').textContent = targetUrl;
      document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQRModal() { document.getElementById('qrModal').style.display = 'none'; }

    // Init Logic
    rosterInput.value = roster.join('\n');
    drawWheel();
    setInterval(fetchLiveRoster, 4000); // Poll backend every 4s
  </script>
</body>
</html>
