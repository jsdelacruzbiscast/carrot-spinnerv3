<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner - Join Stage Session</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0B0F17; color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif; }
    .gold-accent { color: #FFD700; }
    .btn-gold { background: linear-gradient(180deg, #FFD700 0%, #D4AF37 100%); color: #000; font-weight: 800; }
    .btn-gold:hover { background: #FFC700; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <header class="text-center py-4 border-b border-slate-800">
    <div class="text-3xl mb-1">🥕</div>
    <h1 class="text-lg font-black tracking-wider gold-accent uppercase">CARROT SPINNER</h1>
    <p class="text-[11px] text-slate-400">BISCAST Student Development Services</p>
  </header>

  <main class="flex-1 flex flex-col justify-center max-w-sm w-full mx-auto my-6 space-y-4">
    
    <!-- Submission Form Card -->
    <div id="formCard" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Room PIN</label>
        <input type="text" id="pinInput" placeholder="6-Digit PIN" maxlength="6" 
               class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-xl font-mono font-bold gold-accent uppercase tracking-widest focus:outline-none focus:border-amber-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Your Full Name</label>
        <input type="text" id="nameInput" placeholder="Juan Dela Cruz" 
               class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
      </div>

      <button id="submitBtn" onclick="submitParticipantEntry()" class="w-full py-3.5 btn-gold font-bold text-sm rounded-xl shadow-lg transition">
        JOIN SPINNER
      </button>

      <p id="errorMsg" class="text-xs text-red-400 text-center font-medium hidden"></p>
    </div>

    <!-- Success Confirmation State -->
    <div id="successCard" class="bg-slate-900 border border-amber-500/30 rounded-2xl p-6 text-center space-y-3 hidden">
      <div class="text-4xl">🎉</div>
      <h2 class="text-lg font-bold gold-accent">You're in the Wheel!</h2>
      <p class="text-xs text-slate-300">Look at the main stage screen. Your name will appear on the spinner wheel.</p>
    </div>

  </main>

  <footer class="text-center text-[10px] text-slate-600 py-2">
    CARROT Spinner Mobile v3.2
  </footer>

  <script>
    let API_URL = localStorage.getItem('carrot_api_url') || "https://script.google.com/macros/s/AKfycbzmn_bEzidauL9CNgsI8Sp7ezjev8ZjTBYI9RckwkzvZ21JIxVx7_LuJBmkSWvR7FHssA/exec";

    // Auto-fill PIN from URL parameters (?pin=123456)
    const urlParams = new URLSearchParams(window.location.search);
    const pinParam = urlParams.get('pin');
    if (pinParam) {
      document.getElementById('pinInput').value = pinParam;
    }

    async function submitParticipantEntry() {
      const pin = document.getElementById('pinInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.classList.add('hidden');

      if (!pin || pin.length !== 6) {
        errorMsg.textContent = "Please enter a valid 6-digit Room PIN.";
        errorMsg.classList.remove('hidden');
        return;
      }

      if (!name) {
        errorMsg.textContent = "Please enter your name.";
        errorMsg.classList.remove('hidden');
        return;
      }

      // Check single-submission lock
      if (localStorage.getItem(`carrot_submitted_${pin}`)) {
        errorMsg.textContent = "You have already joined this room session.";
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.textContent = "Joining...";
      submitBtn.disabled = true;

      try {
        const payload = { action: "submitEntry", pin: pin, name: name };
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.status === 'SUCCESS') {
          localStorage.setItem(`carrot_submitted_${pin}`, 'true');
          document.getElementById('formCard').classList.add('hidden');
          document.getElementById('successCard').classList.remove('hidden');
        } else {
          errorMsg.textContent = data.message || "Failed to submit entry.";
          errorMsg.classList.remove('hidden');
        }
      } catch (e) {
        errorMsg.textContent = "Network error. Please check your connection and try again.";
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.textContent = "JOIN SPINNER";
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
