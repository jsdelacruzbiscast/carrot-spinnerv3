<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner | Join Session</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0F172A, #1E293B); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">

  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700 p-6 shadow-2xl text-center">
    <!-- Header -->
    <div class="mb-6">
      <span class="text-xs font-semibold uppercase tracking-wider text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full">
        BISCAST SDS Event Portal
      </span>
      <h1 class="text-2xl font-extrabold mt-3 text-slate-100">🥕 CARROT Spinner</h1>
      <p class="text-xs text-slate-400 mt-1">Enter your room PIN and name to join the wheel</p>
    </div>

    <!-- Form -->
    <div id="entryForm" class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Room PIN</label>
        <input type="number" id="roomPinInput" placeholder="e.g. 482910" 
          class="w-full text-center text-2xl font-black tracking-widest bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-amber-400 focus:outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Your Full Name</label>
        <input type="text" id="nameInput" placeholder="Juan Dela Cruz" 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <button onclick="submitParticipant()" id="submitBtn" 
        class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-extrabold text-lg py-3 rounded-xl transition shadow-lg shadow-orange-500/20 active:scale-95">
        Join Spinner 🚀
      </button>
    </div>

    <!-- Feedback Message -->
    <div id="statusBox" class="hidden mt-6 p-4 rounded-xl text-center"></div>

    <footer class="mt-6 border-t border-slate-700/50 pt-4 text-[11px] text-slate-500">
      Developed by BISCAST Student Development Services
    </footer>
  </div>

  <script>
    // REPLACE WITH YOUR DEPLOYED GOOGLE APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbynRv_77pNykgCch-W2ACO_GIzZ-Q39lN5P85wF2iaGp1cz5ClHVMNDe6NFhSz-rhW8/exec";

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pinParam = urlParams.get('pin');
      if (pinParam) {
        document.getElementById('roomPinInput').value = pinParam;
      }
    });

    async function submitParticipant() {
      const pin = document.getElementById('roomPinInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();
      const statusBox = document.getElementById('statusBox');
      const submitBtn = document.getElementById('submitBtn');

      if (!pin || pin.length !== 6) {
        showStatus("Please enter a valid 6-digit Room PIN.", "error");
        return;
      }
      if (!name) {
        showStatus("Please enter your name.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Joining...";
      showStatus("Connecting to host room...", "info");

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitEntry',
            roomCode: pin,
            name: name
          })
        });

        const res = await response.json();

        if (res.success) {
          showStatus("🎉 You're in! Watch the main screen.", "success");
          document.getElementById('entryForm').classList.add('hidden');
        } else {
          showStatus(res.message || "Failed to join room.", "error");
          submitBtn.disabled = false;
          submitBtn.innerText = "Join Spinner 🚀";
        }
      } catch (err) {
        showStatus("Network error. Please try again.", "error");
        submitBtn.disabled = false;
        submitBtn.innerText = "Join Spinner 🚀";
      }
    }

    function showStatus(msg, type) {
      const statusBox = document.getElementById('statusBox');
      statusBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'bg-green-500/20', 'text-green-300', 'bg-blue-500/20', 'text-blue-300');

      if (type === 'error') {
        statusBox.classList.add('bg-red-500/20', 'text-red-300', 'border', 'border-red-500/30');
      } else if (type === 'success') {
        statusBox.classList.add('bg-green-500/20', 'text-green-300', 'border', 'border-green-500/30');
      } else {
        statusBox.classList.add('bg-blue-500/20', 'text-blue-300', 'border', 'border-blue-500/30');
      }
      statusBox.innerText = msg;
    }
  </script>
</body>
</html>
