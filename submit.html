<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner - Join Room</title>
  <style>
    :root {
      --maroon: #800000;
      --gold: #FFD700;
      --dark-bg: #0A0E1A;
      --card-bg: rgba(255, 255, 255, 0.05);
    }
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      color: #F8FAFC;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%; max-width: 400px; padding: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px; text-align: center;
    }
    h2 { color: var(--gold); margin-bottom: 0.2rem; }
    .subtitle { font-size: 0.75rem; color: #aaa; margin-bottom: 1.5rem; }
    .input-group { margin-bottom: 1.2rem; text-align: left; }
    label { display: block; font-size: 0.8rem; color: var(--gold); margin-bottom: 4px; }
    input {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: linear-gradient(135deg, var(--maroon), #a00000);
      color: var(--gold); font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #statusMsg { margin-top: 1rem; font-size: 0.9rem; font-weight: bold; }
    .success { color: #4ADE80; }
    .error { color: #F87171; }
  </style>
</head>
<body>
  <div class="container">
    <h2>CARROT Spinner</h2>
    <div class="subtitle">BISCAST Student Development Services</div>
    
    <form id="regForm">
      <div class="input-group">
        <label for="roomPin">Room PIN</label>
        <input type="text" id="roomPin" placeholder="6-Digit PIN" required readonly>
      </div>
      <div class="input-group">
        <label for="fullName">Your Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Juan Dela Cruz" required>
      </div>
      <button type="submit" id="submitBtn">Join Draw</button>
    </form>
    <div id="statusMsg"></div>
  </div>

  <script>
    const ENDPOINT = "https://script.google.com/macros/s/AKfycby_6xYp8WFW1E_pyPNjs5IINOAn-BkqDzzib9GBg_bC1WCxCIbyiqAmYohXkhIPPYly6g/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const pinParam = urlParams.get('pin');
    const pinInput = document.getElementById('roomPin');
    
    if (pinParam) {
      pinInput.value = pinParam;
    } else {
      pinInput.removeAttribute('readonly');
    }

    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');
      const pin = pinInput.value.trim();
      const name = document.getElementById('fullName').value.trim();

      if (!pin || !name) return;

      btn.disabled = true;
      status.className = '';
      status.textContent = 'Submitting entry...';

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitName', pin: pin, name: name })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'SUCCESS') {
          status.className = 'success';
          status.textContent = "You're registered! Look at the main screen.";
          document.getElementById('fullName').value = '';
        } else if (data.status === 'EXISTS') {
          status.className = 'error';
          status.textContent = 'Name already registered in this room.';
        } else {
          status.className = 'error';
          status.textContent = data.message || 'Registration failed.';
        }
      })
      .catch(() => {
        status.className = 'error';
        status.textContent = 'Network error. Try again.';
      })
      .finally(() => { btn.disabled = false; });
    });
  </script>
</body>
</html>
