<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner - Participant Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800/90 border border-slate-700 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-block px-3 py-1 bg-orange-500/20 text-orange-400 rounded-full text-xs font-semibold mb-2">
        BISCAST SDS Event Portal
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Join CARROT Spinner</h1>
      <p class="text-xs text-slate-400 mt-1">Enter your details to join the live event selection wheel.</p>
    </div>

    <!-- Single Submission Warning Banner -->
    <div id="alreadyRegisteredBanner" class="hidden mb-4 p-4 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-300 text-sm text-center">
      📌 <strong>Notice:</strong> You are already registered for this room session. Look at the main event screen for updates!
    </div>

    <!-- Entry Form -->
    <form id="entryForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">6-Digit Room PIN</label>
        <input type="text" id="roomPin" maxlength="6" placeholder="e.g. 482910" required 
               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center font-mono text-xl tracking-widest text-orange-400 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Your Full Name</label>
        <input type="text" id="participantName" placeholder="e.g. Juan Dela Cruz" required 
               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-orange-500">
      </div>

      <button type="submit" id="submitBtn" 
              class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl shadow-lg transition-all duration-200 transform active:scale-95">
        Submit Entry
      </button>
    </form>

    <!-- Status Alerts -->
    <div id="statusAlert" class="hidden mt-4 p-3 rounded-xl text-sm text-center"></div>

    <div class="mt-6 text-center text-xs text-slate-500">
      Developed by: BISCAST Student Development Services
    </div>
  </div>

  <script>
    // Paste your Google Apps Script Exec Endpoint URL here
    const API_URL = "https://script.google.com/macros/s/AKfycbzmn_bEzidauL9CNgsI8Sp7ezjev8ZjTBYI9RckwkzvZ21JIxVx7_LuJBmkSWvR7FHssA/exec";

    const form = document.getElementById('entryForm');
    const roomPinInput = document.getElementById('roomPin');
    const nameInput = document.getElementById('participantName');
    const submitBtn = document.getElementById('submitBtn');
    const statusAlert = document.getElementById('statusAlert');
    const alreadyRegisteredBanner = document.getElementById('alreadyRegisteredBanner');

    // Auto-fill PIN from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const pinParam = urlParams.get('pin');
    if (pinParam) {
      roomPinInput.value = pinParam;
      checkLockStatus(pinParam);
    }

    roomPinInput.addEventListener('input', () => {
      checkLockStatus(roomPinInput.value.trim());
    });

    function checkLockStatus(pin) {
      if (pin.length === 6 && localStorage.getItem('carrot_registered_' + pin)) {
        alreadyRegisteredBanner.classList.remove('hidden');
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        alreadyRegisteredBanner.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = roomPinInput.value.trim();
      const name = nameInput.value.trim();

      if (pin.length !== 6) {
        showAlert('Please enter a valid 6-digit Room PIN.', 'bg-red-500/20 text-red-300 border border-red-500/30');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const payload = {
          action: 'submitEntry',
          pin: pin,
          name: name
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.status === 'SUCCESS') {
          // Lock registration for this device/PIN
          localStorage.setItem('carrot_registered_' + pin, 'true');
          showAlert('🎉 Success! Your entry is registered on the live stage.', 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30');
          form.reset();
          checkLockStatus(pin);
        } else {
          showAlert(data.message || 'Submission failed. Try again.', 'bg-red-500/20 text-red-300 border border-red-500/30');
          submitBtn.disabled = false;
        }
      } catch (err) {
        showAlert('Network error. Check your connection.', 'bg-red-500/20 text-red-300 border border-red-500/30');
        submitBtn.disabled = false;
      } finally {
        submitBtn.textContent = 'Submit Entry';
      }
    });

    function showAlert(msg, classes) {
      statusAlert.className = `mt-4 p-3 rounded-xl text-sm text-center ${classes}`;
      statusAlert.textContent = msg;
      statusAlert.classList.remove('hidden');
    }
  </script>
</body>
</html>
