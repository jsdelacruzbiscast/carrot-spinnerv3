  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARROT Spinner - Join Room</title>
  <style>
    :root {
      --maroon: #800000;
      --gold: #FFD700;
      --dark-bg: #0A0E1A;
      --card-bg: rgba(255, 255, 255, 0.05);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--dark-bg);
      color: #F8FAFC;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 400px;
      padding: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h2 { color: var(--gold); margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 1.5rem; }
    .input-group { margin-bottom: 1.2rem; text-align: left; }
    label { display: block; font-size: 0.8rem; color: var(--gold); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    input:focus { border-color: var(--gold); outline: none; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--maroon), #a00000);
      color: var(--gold);
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(128, 0, 0, 0.4);
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #statusMsg { margin-top: 1rem; font-size: 0.9rem; font-weight: bold; }
    .success { color: #4ADE80; }
    .error { color: #F87171; }

    #headcountMsg {
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: var(--gold);
      opacity: 0.85;
    }

    .reactionBar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 1.25rem;
    }
    .reactionBtn {
      width: auto;
      flex: none;
      padding: 8px 12px;
      font-size: 1.3rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      box-shadow: none;
      transition: transform 0.1s ease;
    }
    .reactionBtn:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>BISCAST SDS</h2>
    <p>Enter your full name to join the live draw roster.</p>
    <div id="headcountMsg"></div>

    <form id="regForm">
      <div class="input-group">
        <label for="roomPin">Room PIN</label>
        <input type="text" id="roomPin" placeholder="6-Digit PIN" required readonly>
      </div>
      <div class="input-group">
        <label for="fullName">Your Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Juan Dela Cruz" required>
      </div>
      <button type="submit" id="submitBtn">Join Spinner</button>
    </form>
    <div id="statusMsg"></div>

    <div class="reactionBar" id="reactionBar">
      <button type="button" class="reactionBtn" onclick="sendReaction('👍')">👍</button>
      <button type="button" class="reactionBtn" onclick="sendReaction('❤️')">❤️</button>
      <button type="button" class="reactionBtn" onclick="sendReaction('😂')">😂</button>
      <button type="button" class="reactionBtn" onclick="sendReaction('🎉')">🎉</button>
      <button type="button" class="reactionBtn" onclick="sendReaction('👏')">👏</button>
    </div>
  </div>

  <!-- Firebase (Realtime Database) -- powers the live headcount and emoji
       reactions. Use the exact same project/config as index.html. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // Paste your Web App URL here
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbwHinZJKlrzpFN8Lbc9d46gNbIYH_H9-BsY2CDBWRD51i4fpDfdTBaz4wNrm5iFmJhUnQ/exec";
    // Fill these in from the Firebase console -- same project/values used in
    // index.html's FIREBASE_CONFIG.
    const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAraGE0A3t9Hj7LYdHYTvmKpwKA8Mv6XMc",
  databaseURL: "https://carrot-spinner-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    let firebaseDb = null;
    let headcountRef = null;

    try {
      if (FIREBASE_CONFIG.apiKey.indexOf("YOUR_FIREBASE") === -1) {
        firebase.initializeApp(FIREBASE_CONFIG);
        firebaseDb = firebase.database();
      }
    } catch (err) {
      console.warn("Firebase init failed (headcount/reactions disabled):", err);
    }

    /** Live "N people have joined" readout, updates instantly via Firebase. */
    function subscribeHeadcount(pin) {
      if (!firebaseDb || !pin) return;
      if (headcountRef) headcountRef.off();

      headcountRef = firebaseDb.ref(`rooms/${pin}/roster`);
      headcountRef.on('value', (snapshot) => {
        const arr = snapshot.val();
        const count = Array.isArray(arr) ? arr.filter(Boolean).length : 0;
        const el = document.getElementById('headcountMsg');
        if (el) el.textContent = count === 0 ? 'Be the first to join!' : `${count} ${count === 1 ? 'person has' : 'people have'} joined`;
      });
    }

    /**
     * Reactions are ephemeral engagement pings, not a permanent record, so
     * they write straight to Firebase from the browser instead of round-
     * tripping through Apps Script -- lower latency, and consistent with the
     * public write rules already in place on the rooms/ path.
     */
    function sendReaction(emoji) {
      if (!firebaseDb) return;
      const pin = pinInput.value.trim();
      if (!pin) return;
      firebaseDb.ref(`rooms/${pin}/reactions`).push({ emoji: emoji, ts: Date.now() }).catch(() => {});
    }

    // --- Per-device entry limit --------------------------------------------
    // Enforced client-side via localStorage (persists across reloads, unlike
    // sessionStorage). This is a soft limit -- clearing browser data or using
    // a different browser resets it -- but it discourages the common case of
    // one person casually submitting several names from the same phone.

    function deviceSubmitCountKey(pin) {
      return `carrotSubmitCount_${pin}`;
    }

    function getDeviceSubmitCount(pin) {
      return parseInt(localStorage.getItem(deviceSubmitCountKey(pin)) || '0', 10);
    }

    function incrementDeviceSubmitCount(pin) {
      const next = getDeviceSubmitCount(pin) + 1;
      localStorage.setItem(deviceSubmitCountKey(pin), String(next));
      return next;
    }

    /**
     * Checks this room's configured cap (rooms/{pin}/maxPerDevice) against
     * how many times this device has already submitted here. Fails open
     * (allows submission) if Firebase is unreachable or no limit is set --
     * consistent with how the rest of this app treats Firebase as a
     * best-effort layer, never a hard dependency for the core flow.
     */
    async function checkDeviceLimit(pin) {
      if (!firebaseDb) return { allowed: true };
      try {
        const snap = await firebaseDb.ref(`rooms/${pin}/maxPerDevice`).once('value');
        const max = snap.val();
        if (!max) return { allowed: true };
        const used = getDeviceSubmitCount(pin);
        return { allowed: used < max, used, max };
      } catch (err) {
        return { allowed: true };
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const pinParam = urlParams.get('pin');
    const pinInput = document.getElementById('roomPin');
    
    if (pinParam) {
      pinInput.value = pinParam;
      subscribeHeadcount(pinParam);
      checkDeviceLimit(pinParam).then(applyDeviceLimitState);
    } else {
      pinInput.removeAttribute('readonly');
      // No PIN in the URL (manual entry) -- start tracking the headcount
      // once the presenter's PIN is actually typed in.
      pinInput.addEventListener('change', () => {
        const pin = pinInput.value.trim();
        subscribeHeadcount(pin);
        if (pin) checkDeviceLimit(pin).then(applyDeviceLimitState);
      });
    }

    /** Reflects the device-limit check in the UI, ahead of any submit attempt. */
    function applyDeviceLimitState(result) {
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');
      if (!result.allowed) {
        btn.disabled = true;
        status.className = 'error';
        status.textContent = `You've reached the limit of ${result.max} ${result.max === 1 ? 'entry' : 'entries'} on this device for this room.`;
      }
    }

    document.getElementById('regForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMsg');
      const pin = pinInput.value.trim();
      const name = document.getElementById('fullName').value.trim();

      if (!pin || !name) return;

      const limitCheck = await checkDeviceLimit(pin);
      if (!limitCheck.allowed) {
        applyDeviceLimitState(limitCheck);
        return;
      }

      btn.disabled = true;
      status.className = '';
      status.textContent = 'Submitting registration...';

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitName', pin: pin, name: name })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'SUCCESS') {
          status.className = 'success';
          status.textContent = "You're in! Look at the main screen.";
          document.getElementById('fullName').value = '';
          incrementDeviceSubmitCount(pin);
          checkDeviceLimit(pin).then(applyDeviceLimitState);
        } else if (data.status === 'EXISTS') {
          status.className = 'error';
          status.textContent = 'Name already registered in this room.';
        } else if (data.status === 'LOCKED') {
          status.className = 'error';
          status.textContent = 'Registration is closed for this room -- the draw is starting.';
        } else {
          status.className = 'error';
          status.textContent = data.message || 'Error joining room.';
        }
      })
      .catch(err => {
        status.className = 'error';
        status.textContent = 'Network error. Please try again.';
      })
      .finally(() => { btn.disabled = false; });
    });
  </script>
</body>
</html>
